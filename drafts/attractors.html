<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sumeet Musfirah</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f2ede6; --dim: rgba(242,237,230,.55); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #07070a; color: var(--ink); overflow: hidden; font-family: Inter, system-ui, sans-serif; font-weight: 300; }
  canvas { position: fixed; inset: 0; display: block; cursor: crosshair; }
  .ui { position: fixed; inset: 0; pointer-events: none; padding: 28px 32px; display: flex; flex-direction: column; justify-content: space-between; }
  .ui a, .ui button, .name { pointer-events: auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  .name { font-family: "Instrument Serif", serif; font-size: 26px; letter-spacing: .01em; cursor: default; user-select: none; }
  .name span { display: inline-block; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  nav { display: flex; gap: 22px; font-size: 13px; }
  nav a { color: var(--dim); text-decoration: none; transition: color .3s; }
  nav a:hover { color: var(--ink); }
  .line { font-family: "Instrument Serif", serif; font-size: clamp(26px, 4vw, 46px); line-height: 1.12; max-width: 15em; }
  .line i { color: #e7b98f; }
  .hint { margin-top: 14px; font-size: 13px; color: var(--dim); }
  .toast { position: fixed; left: 50%; bottom: 36px; transform: translate(-50%, 20px); opacity: 0; transition: all .5s ease; font-family: "Instrument Serif", serif; font-style: italic; font-size: 20px; pointer-events: none; text-align: center; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  /* a tiny chai cup, easy to miss */
  .cup { position: fixed; right: 26px; bottom: 22px; width: 22px; height: 26px; opacity: .32; cursor: pointer; pointer-events: auto; transition: opacity .4s, transform .4s; background: none; border: 0; }
  .cup:hover { opacity: 1; transform: rotate(-8deg) scale(1.15); }
  .cup svg { width: 100%; height: 100%; overflow: visible; }
  .cup .steam { stroke-dasharray: 3 4; animation: steam 2.4s linear infinite; opacity: .8; }
  .cup .steam.b { animation-delay: -1.2s; }
  .cup.brewing .tea { fill: #c8915c; }
  .cup.brewing { opacity: 1; }
  @keyframes steam { from { stroke-dashoffset: 14; opacity: 0; } 30% { opacity: .9; } to { stroke-dashoffset: 0; opacity: 0; } }
  @media (max-width: 600px) { .ui { padding: 20px; } nav { gap: 14px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <header>
    <div class="name" id="name">Sumeet Musfirah</div>
    <nav><a href="#">Research</a><a href="#">Journal</a><a href="#">About</a><a href="#">Say hi</a></nav>
  </header>
  <div>
    <p class="line">I study what pulls a mind toward a belief. <i>Human or machine.</i></p>
    <p class="hint">Click anywhere to add a new voice. See who follows.</p>
  </div>
</div>
<div class="toast" id="toast"></div>
<button class="cup" id="cup" aria-label="chai">
  <svg viewBox="0 0 22 26" fill="none" stroke="#f2ede6" stroke-width="1.2" stroke-linecap="round">
    <path class="steam" d="M8 9 C6 6 10 5 8 1"/><path class="steam b" d="M13 9 C11 6 15 5 13 1"/>
    <path class="tea" d="M3 12 h14 l-1.6 10.5 a2 2 0 0 1 -2 1.5 h-6.8 a2 2 0 0 1 -2 -1.5 Z" fill="none"/>
    <path d="M17 14.5 c3 0 3.6 5 -0.6 5.4"/>
  </svg>
</button>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from "three";

const N = 24000;
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.set(0, 0, 9);

// Attractors: each is a "voice" with a position, a spin axis and a pull.
const voices = [
  { p: new THREE.Vector3(-2.2, 0.4, 0), axis: new THREE.Vector3(0, 1, 0.3).normalize(), pull: 1, life: Infinity },
  { p: new THREE.Vector3(2.0, -0.6, -0.5), axis: new THREE.Vector3(1, 0.2, 0).normalize(), pull: 1, life: Infinity },
  { p: new THREE.Vector3(0.2, 1.6, 0.6), axis: new THREE.Vector3(0.2, 0, 1).normalize(), pull: 0.8, life: Infinity },
];

const pos = new Float32Array(N * 3), vel = new Float32Array(N * 3), col = new Float32Array(N * 3);
const PAL = {
  dusk: [[0.93, 0.72, 0.56], [0.86, 0.47, 0.42], [0.62, 0.55, 0.85]],
  chai: [[0.80, 0.56, 0.34], [0.95, 0.85, 0.70], [0.55, 0.35, 0.22]],
  mono: [[0.95, 0.93, 0.90], [0.6, 0.6, 0.62], [0.85, 0.82, 0.78]],
};
let palette = "dusk";
function paint() {
  for (let i = 0; i < N; i++) {
    const c = PAL[palette][i % 3], k = 0.7 + Math.random() * 0.3;
    col.set([c[0] * k, c[1] * k, c[2] * k], i * 3);
  }
  geo.attributes.color.needsUpdate = true;
}
for (let i = 0; i < N; i++) {
  const r = 4 * Math.cbrt(Math.random()), t = Math.random() * Math.PI * 2, u = Math.random() * 2 - 1, s = Math.sqrt(1 - u * u);
  pos.set([r * s * Math.cos(t), r * s * Math.sin(t), r * u], i * 3);
}
const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
paint();
const mat = new THREE.PointsMaterial({ size: 0.022, vertexColors: true, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
const pts = new THREE.Points(geo, mat);
scene.add(pts);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const tmp = new THREE.Vector3(), d = new THREE.Vector3(), spin = new THREE.Vector3();
let last = performance.now(), calm = false;
function step(dt) {
  const damp = calm ? 0.94 : 0.985;
  for (let i = 0; i < N; i++) {
    const j = i * 3;
    tmp.set(pos[j], pos[j + 1], pos[j + 2]);
    let ax = 0, ay = 0, az = 0;
    for (const v of voices) {
      d.subVectors(v.p, tmp);
      const dist2 = Math.max(d.lengthSq(), 0.15);
      const g = v.pull * 0.9 / dist2;
      d.normalize();
      spin.crossVectors(v.axis, d).multiplyScalar(g * 1.4);
      ax += d.x * g + spin.x; ay += d.y * g + spin.y; az += d.z * g + spin.z;
    }
    vel[j] = (vel[j] + ax * dt) * damp; vel[j + 1] = (vel[j + 1] + ay * dt) * damp; vel[j + 2] = (vel[j + 2] + az * dt) * damp;
    const sp = Math.hypot(vel[j], vel[j + 1], vel[j + 2]);
    if (sp > 3) { const k = 3 / sp; vel[j] *= k; vel[j + 1] *= k; vel[j + 2] *= k; }
    pos[j] += vel[j] * dt; pos[j + 1] += vel[j + 1] * dt; pos[j + 2] += vel[j + 2] * dt;
  }
  geo.attributes.position.needsUpdate = true;
}

// Mouse gently tilts the scene.
let mx = 0, my = 0;
addEventListener("pointermove", (e) => { mx = e.clientX / innerWidth - 0.5; my = e.clientY / innerHeight - 0.5; });

// Click: a new, loud voice that fades over a few seconds.
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hit = new THREE.Vector3();
canvas.addEventListener("click", (e) => {
  ray.setFromCamera({ x: (e.clientX / innerWidth) * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 }, camera);
  if (!ray.ray.intersectPlane(plane, hit)) return;
  pts.worldToLocal(hit);
  voices.push({ p: hit.clone(), axis: new THREE.Vector3(Math.random() - .5, Math.random() - .5, 1).normalize(), pull: 2.2, life: 6 });
  clicks++;
  if (clicks === 7) toast("Seven loud voices. Nobody is listening to the evidence anymore.");
});
let clicks = 0;

// ── Hidden things ──
const toastEl = document.getElementById("toast");
let tt; function toast(s) { toastEl.textContent = s; toastEl.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove("on"), 3200); }

// 0. The tiny cup in the corner brews chai too.
const cup = document.getElementById("cup");
function chai() { palette = palette === "chai" ? "dusk" : "chai"; paint(); cup.classList.toggle("brewing", palette === "chai"); toast(palette === "chai" ? "chai break ☕" : "back to work"); }
cup.addEventListener("click", (e) => { e.stopPropagation(); chai(); });

// 1. Type "chai": everything turns chai-coloured.
// 2. Type "calm": the noise settles down.
// 3. Type "doubt": every voice loses its pull for a moment, and the particles drift free.
let typed = "";
addEventListener("keydown", (e) => {
  typed = (typed + e.key.toLowerCase()).slice(-8);
  if (typed.endsWith("chai")) chai();
  if (typed.endsWith("calm")) { calm = !calm; toast(calm ? "breathe." : "and we're back."); }
  if (typed.endsWith("doubt")) { voices.forEach(v => v.saved = v.pull, v.pull = 0); toast("for a moment, no one is sure of anything."); setTimeout(() => voices.forEach(v => v.pull = v.saved ?? v.pull), 2500); }
});

// 4. Hover the name: the letters are pulled apart, then settle back.
const nameEl = document.getElementById("name");
nameEl.innerHTML = [...nameEl.textContent].map(c => `<span>${c === " " ? "&nbsp;" : c}</span>`).join("");
nameEl.addEventListener("mouseenter", () => nameEl.querySelectorAll("span").forEach(s => s.style.transform = `translate(${(Math.random() - .5) * 18}px, ${(Math.random() - .5) * 14}px) rotate(${(Math.random() - .5) * 20}deg)`));
nameEl.addEventListener("mouseleave", () => nameEl.querySelectorAll("span").forEach(s => s.style.transform = ""));

// 5. For whoever opens the console.
console.log("%chi, curious one. try typing chai, calm, or doubt.", "font: italic 16px serif; color: #e7b98f");

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.033); last = now;
  for (let k = voices.length - 1; k >= 0; k--) { const v = voices[k]; if (v.life !== Infinity && (v.life -= dt) <= 0) voices.splice(k, 1); }
  step(dt);
  pts.rotation.y += (mx * 0.6 - pts.rotation.y) * 0.03 + 0.0008;
  pts.rotation.x += (my * 0.4 - pts.rotation.x) * 0.03;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
