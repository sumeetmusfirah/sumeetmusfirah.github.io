<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuro particle drafts</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,300,100,1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #07070a; color: #f2ede6; overflow: hidden; font-family: Inter, sans-serif; font-weight: 300; }
  canvas { position: fixed; inset: 0; display: block; }
  .bar { position: fixed; left: 0; right: 0; bottom: 26px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 16px; }
  .bar button { font: 400 12.5px Inter, sans-serif; letter-spacing: .06em; color: rgba(242,237,230,.6); background: rgba(15,15,20,.6); border: 1px solid rgba(242,237,230,.16); padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: all .3s; }
  .bar button:hover { color: #f2ede6; }
  .bar button.on { color: #07070a; background: #e7d8c4; border-color: #e7d8c4; }
  .title { position: fixed; left: 32px; top: 26px; font-family: Fraunces, serif; font-style: italic; font-weight: 300; font-size: 26px; }
  .note { position: fixed; right: 32px; top: 32px; font-size: 13px; color: rgba(242,237,230,.5); }
</style>
</head>
<body>
<div class="title">Sumeet Musfirah</div>
<div class="note">draft &middot; shapes change on their own</div>
<div class="bar" id="bar"></div>

<div id="err" style="position:fixed;left:16px;right:16px;top:80px;color:#e7b98f;font:13px Inter,sans-serif;white-space:pre-wrap"></div>
<script>
  // if anything fails, say so on the page instead of showing a blank screen
  window.onerror = (m, src, line) => { document.getElementById("err").textContent = "Error: " + m + " (line " + line + ")"; };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const N = innerWidth < 700 ? 12000 : 22000;
const R = Math.random, TAU = Math.PI * 2;
const gauss = () => (R() + R() + R() - 1.5) / 1.5;

// ── Shapes: each returns target positions (N*3) and a colour index per particle ──
function field() {
  const p = new Float32Array(N * 3), c = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const r = 3.4 * Math.cbrt(R()), t = R() * TAU, u = R() * 2 - 1, s = Math.sqrt(1 - u * u);
    p.set([r * s * Math.cos(t), r * s * Math.sin(t), r * u], i * 3); c[i] = R();
  }
  return { p, c };
}

// A point on the cerebral surface (side view: x = front/back, y = up/down, z = left/right).
function cortexPoint() {
  for (;;) {
    const t = R() * TAU, u = R() * 2 - 1, sq = Math.sqrt(1 - u * u);
    const side = R() < 0.5 ? -1 : 1;
    const dx = sq * Math.cos(t), dy = u, dz = Math.abs(sq * Math.sin(t)) * side;
    let x = dx * 1.95, z = dz * 0.8 + side * 0.06;
    // dome on top; underside dips lower at the front-middle (temporal lobe), higher at the back
    const drop = 0.55 + 0.45 * Math.exp(-(((x - 0.35) / 0.75) ** 2));
    let y = dy > 0 ? dy * 1.3 : dy * drop;
    if (x > 1.2 && y < -0.2) y = -0.2 + (y + 0.2) * 0.4; // tuck the frontal underside
    // Sylvian fissure: a groove running up and back along the side
    const fiss = y - (-0.12 + 0.32 * (0.9 - x));
    if (Math.abs(fiss) < 0.07 && x > -0.4 && x < 1.35 && Math.abs(z) > 0.35) continue;
    // gyri: keep most particles on the fold lines so the folds read as drawn contours
    const g = Math.sin(6.5 * x + 2.2 * Math.sin(3.1 * y + z)) + Math.sin(6 * y + 1.7 * Math.sin(3.7 * x - z));
    if (Math.abs(g) > 0.32 && R() > 0.22) continue;
    return [x, y, z, (x + 2) / 4];
  }
}

function brain(regions) {
  const p = new Float32Array(N * 3), c = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const k = R();
    let x, y, z, col, reg;
    if (k < 0.82) { [x, y, z, col] = cortexPoint(); col = 0.2 + col * 0.55; reg = 0; }
    else if (k < 0.93) { // cerebellum, finely striped, tucked under the back
      const t = R() * TAU, u = R() * 2 - 1, sq = Math.sqrt(1 - u * u);
      if (Math.abs(Math.sin(34 * u)) > 0.5 && R() > 0.3) { i--; continue; }
      x = -1.45 + sq * Math.cos(t) * 0.55; y = -0.78 + u * 0.36; z = sq * Math.sin(t) * 0.95; col = 0.85; reg = 1;
    } else { // brainstem
      const h = R(), a = R() * TAU, r = 0.2 * Math.sqrt(R());
      x = -0.75 - h * 0.25 + r * Math.cos(a); y = -0.75 - h * 1.25; z = r * Math.sin(a); col = 0.95; reg = 2;
    }
    p.set([x * 1.5, y * 1.5 + 0.35, z * 1.5], i * 3); c[i] = col;
    if (regions) regions[i] = reg;
  }
  return { p, c };
}

function spine() {
  const p = new Float32Array(N * 3), c = new Float32Array(N);
  const V = 24;
  const curve = (t) => [0.45 * Math.sin(t * TAU * 1.1 + 0.4) - 0.1, 3.7 - t * 7.6, 0];
  for (let i = 0; i < N; i++) {
    const k = R();
    let x, y, z, col;
    if (k < 0.62) { // vertebral bodies, getting larger toward the bottom
      const v = Math.floor(R() * V), t = (v + 0.5) / V, [cx, cy] = curve(t);
      const rad = 0.22 + 0.2 * t, h = 0.13 + 0.06 * t;
      const a = R() * TAU, r = rad * Math.sqrt(R()), yy = (R() - 0.5) * h;
      x = cx + 0.25 + r * Math.cos(a); y = cy + yy; z = r * Math.sin(a) * 1.15; col = 0.25 + 0.3 * t;
    } else if (k < 0.8) { // processes: back and to both sides
      const v = Math.floor(R() * V), t = (v + 0.5) / V, [cx, cy] = curve(t), w = R();
      const kind = R();
      if (kind < 0.45) { x = cx - 0.1 - w * (0.45 + 0.2 * t); y = cy - w * 0.12; z = gauss() * 0.03; }
      else { const sd = R() < 0.5 ? -1 : 1; x = cx - 0.05 - w * 0.15; y = cy + gauss() * 0.02; z = sd * (0.18 + w * (0.35 + 0.15 * t)); }
      col = 0.6;
    } else { // the spinal cord running through, glowing
      const t = R(), [cx, cy] = curve(t), a = R() * TAU, r = 0.07 * Math.sqrt(R());
      x = cx + 0.02 + r * Math.cos(a); y = cy + (R() - 0.5) * 0.02; z = r * Math.sin(a); col = 1;
    }
    p.set([x * 0.82, y * 0.82, z * 0.82], i * 3); c[i] = col;
  }
  return { p, c };
}

function neuron() {
  // Build a tree of segments, then scatter particles along them by length.
  const segs = []; // [x1,y1,z1,x2,y2,z2,radius,col]
  const walk = (x, y, z, dir, len, depth, col) => {
    let [dx, dy, dz] = dir;
    const steps = Math.round(len / 0.08);
    for (let s = 0; s < steps; s++) {
      dx += gauss() * 0.25; dy += gauss() * 0.25; dz += gauss() * 0.25;
      const m = Math.hypot(dx, dy, dz); dx /= m; dy /= m; dz /= m;
      const nx = x + dx * 0.08, ny = y + dy * 0.08, nz = z + dz * 0.08;
      segs.push([x, y, z, nx, ny, nz, Math.max(0.012, 0.05 - depth * 0.012), col]);
      x = nx; y = ny; z = nz;
    }
    if (depth < 3) for (let b = 0; b < 2; b++) walk(x, y, z, [dx + gauss() * 0.7, dy + gauss() * 0.7, dz + gauss() * 0.7], len * 0.68, depth + 1, col);
  };
  const soma = [0, 1.6, 0];
  for (let d = 0; d < 7; d++) { const a = (d / 7) * TAU; walk(...soma, [Math.cos(a), 0.6 + Math.sin(a) * 0.8, gauss() * 0.6], 0.9, 0, 0.3); }
  // axon with myelin segments, then terminals
  let ax = 0, ay = 1.2;
  for (let s = 0; s < 52; s++) {
    const nx = 0.25 * Math.sin(s / 9), ny = 1.2 - (s + 1) * 0.085, node = s % 7 === 6;
    segs.push([ax, ay, 0, nx, ny, 0, node ? 0.025 : 0.11, node ? 1 : 0.65]); ax = nx; ay = ny;
  }
  for (let t = 0; t < 6; t++) walk(ax, ay, 0, [gauss(), -1, gauss()], 0.5, 1, 0.9);
  const lens = segs.map((s) => Math.hypot(s[3] - s[0], s[4] - s[1], s[5] - s[2]) * (1 + s[6] * 20));
  const total = lens.reduce((a, b) => a + b, 0);
  const p = new Float32Array(N * 3), c = new Float32Array(N);
  const somaN = Math.floor(N * 0.12);
  for (let i = 0; i < somaN; i++) { // the cell body
    const t = R() * TAU, u = R() * 2 - 1, s = Math.sqrt(1 - u * u), r = 0.38 * Math.cbrt(R());
    p.set([soma[0] + r * s * Math.cos(t), soma[1] + r * u, soma[2] + r * s * Math.sin(t)], i * 3); c[i] = 0.95;
  }
  for (let i = somaN; i < N; i++) {
    let pick = R() * total, j = 0;
    while (pick > lens[j]) { pick -= lens[j]; j++; }
    const s = segs[Math.min(j, segs.length - 1)], f = R(), r = s[6];
    p.set([s[0] + (s[3] - s[0]) * f + gauss() * r, s[1] + (s[4] - s[1]) * f + gauss() * r, s[2] + (s[5] - s[2]) * f + gauss() * r], i * 3);
    c[i] = s[7];
  }
  for (let i = 0; i < N * 3; i += 3) { p[i] *= 0.85; p[i + 1] = p[i + 1] * 0.85 + 0.35; p[i + 2] *= 0.85; } // keep the axon clear of the buttons
  return { p, c };
}

function connectome() {
  const regions = new Uint8Array(N);
  const { p, c } = brain(regions);
  const cortex = []; for (let i = 0; i < N; i++) if (regions[i] === 0) cortex.push(i);
  const nodes = Array.from({ length: 18 }, () => { const j = cortex[Math.floor(R() * cortex.length)] * 3; return [p[j], p[j + 1], p[j + 2]]; });
  const pairs = [];
  for (let a = 0; a < nodes.length; a++) for (let b = a + 1; b < nodes.length; b++) if (R() < 0.16) pairs.push([nodes[a], nodes[b]]);
  const centre = [-0.2, 0.55, 0];
  for (let i = 0; i < N; i++) {
    const r = R();
    if (r < 0.5) { c[i] = 0.08 + c[i] * 0.15; continue; } // faint outline of the brain
    if (r < 0.6) { // glowing hubs
      const n = nodes[Math.floor(R() * nodes.length)];
      p.set([n[0] + gauss() * 0.05, n[1] + gauss() * 0.05, n[2] + gauss() * 0.05], i * 3); c[i] = 1; continue;
    }
    const [a, b] = pairs[Math.floor(R() * pairs.length)], t = R(), q = 1 - t;
    const m = [0, 1, 2].map((d) => (a[d] + b[d]) / 2 * 0.45 + centre[d] * 0.55); // bow the thread inward
    p.set([0, 1, 2].map((d) => q * q * a[d] + 2 * q * t * m[d] + t * t * b[d] + gauss() * 0.01), i * 3);
    c[i] = 0.7 + 0.2 * R();
  }
  return { p, c };
}

const SHAPES = { Field: field, Brain: () => brain(), Spine: spine, Neuron: neuron, Connectome: connectome };

// ── Rendering ──
// All motion runs on the graphics card and is timed by the clock, so it looks the same at 30 or 120 fps.
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
const PR = Math.min(devicePixelRatio, 1.5);
renderer.setPixelRatio(PR);
renderer.setClearColor(0x07070a);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 0, 11);

// muted palette: dusty blue → clay → cream
const A = [0.36, 0.42, 0.54], B = [0.72, 0.52, 0.45], C = [0.93, 0.86, 0.74];
const shade = new Float32Array(N).map(() => 0.8 + 0.2 * R());
function colours(tint) {
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const t = tint[i], u = t < 0.5 ? t / 0.5 : (t - 0.5) / 0.5, from = t < 0.5 ? A : B, to = t < 0.5 ? B : C, k = shade[i];
    for (let d = 0; d < 3; d++) out[i * 3 + d] = (from[d] + (to[d] - from[d]) * u) * k;
  }
  return out;
}

// build every shape once up front, so switching never stalls
const BUILT = {};
for (const k of Object.keys(SHAPES)) { const s = SHAPES[k](); BUILT[k] = { p: s.p, c: colours(s.c) }; }

const geo = new THREE.BufferGeometry();
const attr = (name, arr, n) => { const a = new THREE.BufferAttribute(arr, n); a.setUsage(THREE.DynamicDrawUsage); geo.setAttribute(name, a); return a; };
const fromP = attr("aFrom", new Float32Array(N * 3), 3), toP = attr("aTo", new Float32Array(N * 3), 3);
const fromC = attr("aFromC", new Float32Array(N * 3), 3), toC = attr("aToC", new Float32Array(N * 3), 3);
attr("aSeed", new Float32Array(N).map(() => R()), 1);
geo.setAttribute("position", fromP); // three.js needs one; the shader ignores it
geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 20);

const MORPH = 2.2, SPREAD = 0.9; // seconds per particle, and how staggered they leave
const mat = new THREE.ShaderMaterial({
  uniforms: { uT: { value: 99 }, uTime: { value: 0 }, uSize: { value: 0.055 * PR * 520 } },
  vertexShader: `
    attribute vec3 aFrom, aTo, aFromC, aToC; attribute float aSeed;
    uniform float uT, uTime, uSize; varying vec3 vC;
    void main() {
      float k = clamp((uT - aSeed * ${SPREAD.toFixed(2)}) / ${(MORPH - SPREAD).toFixed(2)}, 0.0, 1.0);
      float e = k * k * (3.0 - 2.0 * k);
      vec3 p = mix(aFrom, aTo, e);
      // a soft swirl mid-flight, and a faint breathing drift at rest
      float s = sin(e * 3.14159);
      p += s * 0.6 * vec3(sin(aSeed * 40.0), cos(aSeed * 57.0), sin(aSeed * 23.0));
      p += 0.012 * vec3(sin(uTime * 0.9 + aSeed * 90.0), cos(uTime * 0.7 + aSeed * 70.0), sin(uTime * 0.8 + aSeed * 50.0));
      vC = mix(aFromC, aToC, e);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = uSize / -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vC;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float a = smoothstep(1.0, 0.0, d);
      gl_FragColor = vec4(vC * a * 0.6, 1.0);
    }`,
  transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
});
const pts = new THREE.Points(geo, mat);
scene.add(pts);

// where every particle is right now (same easing as the shader, without the swirl)
const seed = geo.attributes.aSeed.array;
function snapshot() {
  const t = mat.uniforms.uT.value, P = new Float32Array(N * 3), Cc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    let k = Math.min(Math.max((t - seed[i] * SPREAD) / (MORPH - SPREAD), 0), 1); k = k * k * (3 - 2 * k);
    for (let d = 0; d < 3; d++) {
      const j = i * 3 + d;
      P[j] = fromP.array[j] + (toP.array[j] - fromP.array[j]) * k;
      Cc[j] = fromC.array[j] + (toC.array[j] - fromC.array[j]) * k;
    }
  }
  return [P, Cc];
}

let first = true;
function go(name) {
  const s = BUILT[name];
  if (first) { fromP.array.set(BUILT.Field.p); fromC.array.set(BUILT.Field.c); first = false; }
  else { const [P, Cc] = snapshot(); fromP.array.set(P); fromC.array.set(Cc); }
  toP.array.set(s.p); toC.array.set(s.c);
  for (const a of [fromP, toP, fromC, toC]) a.needsUpdate = true;
  mat.uniforms.uT.value = 0;
  document.querySelectorAll(".bar button").forEach((b) => b.classList.toggle("on", b.textContent === name));
}

const bar = document.getElementById("bar");
let auto = true;
Object.keys(SHAPES).forEach((n) => { const b = document.createElement("button"); b.textContent = n; b.onclick = () => { auto = false; go(n); }; bar.appendChild(b); });
const order = Object.keys(SHAPES); let oi = 1;
// open straight into the brain forming, instead of a dim cloud
const want = new URLSearchParams(location.search).get("shape");
if (want && BUILT[want]) { auto = false; go(want); mat.uniforms.uT.value = 99; } else go(order[oi]);
setInterval(() => { if (auto) { oi = (oi + 1) % order.length; go(order[oi]); } }, 6000);

let mx = 0, my = 0;
addEventListener("pointermove", (e) => { mx = e.clientX / innerWidth - 0.5; my = e.clientY / innerHeight - 0.5; });
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.position.z = camera.aspect < 0.8 ? 16 : 11; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

let t0 = performance.now();
function frame(now) {
  const dt = Math.min((now - t0) / 1000, 0.1); t0 = now;
  mat.uniforms.uT.value += dt; mat.uniforms.uTime.value += dt;
  const f = 1 - Math.pow(0.4, dt); // frame-rate independent easing toward the pointer
  pts.rotation.y += (mx * 0.8 - pts.rotation.y) * f + 0.08 * dt;
  pts.rotation.x += (my * 0.4 - pts.rotation.x) * f;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
